# Overlay WAHA khusus staging/demo skripsi:
# docker compose -f docker-compose.prod.yml -f docker-compose.staging.yml up -d --build
services:
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:?WAHA_API_KEY wajib untuk staging WAHA}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?WAHA_DASHBOARD_PASSWORD wajib untuk staging WAHA}
    volumes:
      - waha-staging-session-data:/app/.sessions
    # Dashboard hanya dapat diakses dari host staging untuk scan QR, tidak dari jaringan luar.
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - sop-network

networks:
  sop-network:
    driver: bridge

volumes:
  waha-staging-session-data:
    name: sop-arsip-waha-staging-session-data
