name: CI/CD

on:
  push:
    branches:
      - main
      - final
  pull_request:
    branches:
      - main
      - final

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production compose and build images
        run: |
          cat > .env <<'ENV'
          APP_VERSION=ci
          DB_ROOT_PASSWORD=ci-root-password
          DB_NAME=sop_biro_organisasi
          DB_USER=sop_app
          DB_PASSWORD=ci-db-password
          JWT_SECRET=ci-jwt-secret-minimal-32-karakter
          JWT_REFRESH_SECRET=ci-refresh-secret-minimal-32-karakter
          JWT_EXPIRATION=15m
          JWT_REFRESH_EXPIRATION=7d
          PUBLIC_APP_ORIGIN=http://127.0.0.1
          ALLOWED_ORIGINS=http://127.0.0.1
          SOP_PDF_STORAGE_DIR=/app/storage/sop-pdf
          PDF_SIGNING_ENABLED=false
          PDF_SIGNING_P12_PASSPHRASE=ci-passphrase
          PDF_SIGNING_P12_BASE64=ci-disabled
          ENV
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml build backend frontend

      - name: Run integration tests
        run: |
          docker compose -f docker-compose.test.yml --profile test up \
            --abort-on-container-exit \
            --exit-code-from sop-integration-test
        env:
          INTEGRATION_TEST_PATTERN: ""

      - name: Clean integration test containers
        if: always()
        run: docker compose -f docker-compose.test.yml --profile test down -v

  deploy-production:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/final'
    runs-on: [self-hosted, Linux, X64]
    environment: production
    env:
      DEPLOY_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}
      ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
      DEPLOY_DIR: /opt/sop-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy locally with Docker Compose
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ENV_PRODUCTION:-}" ]; then
            echo "ENV_PRODUCTION secret is required." >&2
            exit 1
          fi

          APP_VERSION="${GITHUB_SHA::12}"
          ARCHIVE="/tmp/sop-app-${APP_VERSION}.tar.gz"
          ENV_FILE="/tmp/sop-app-${APP_VERSION}.env"
          RELEASE_DIR="$DEPLOY_DIR/releases/$APP_VERSION"
          SUDO_PASSWORD="${DEPLOY_SUDO_PASSWORD:-}"

          run_sudo() {
            if [ -n "$SUDO_PASSWORD" ]; then
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' "$@"
            else
              "$@"
            fi
          }

          run_docker() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
            else
              run_sudo docker "$@"
            fi
          }

          DEPLOY_OWNER="$(id -un)"
          DEPLOY_GROUP="$(id -gn)"

          git archive --format=tar.gz --output="$ARCHIVE" HEAD
          {
            printf '%s\n' "$ENV_PRODUCTION"
            printf 'APP_VERSION=%s\n' "$APP_VERSION"
          } > "$ENV_FILE"
          chmod 600 "$ENV_FILE"

          run_sudo mkdir -p "$RELEASE_DIR" "$DEPLOY_DIR/shared"
          run_sudo chown -R "$DEPLOY_OWNER:$DEPLOY_GROUP" "$DEPLOY_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          mv "$ENV_FILE" "$DEPLOY_DIR/shared/.env"
          chmod 600 "$DEPLOY_DIR/shared/.env"
          ln -sfn "$DEPLOY_DIR/shared/.env" "$RELEASE_DIR/.env"
          ln -sfn "$RELEASE_DIR" "$DEPLOY_DIR/current"

          cd "$DEPLOY_DIR/current"

          run_docker compose -f docker-compose.prod.yml config --quiet
          run_docker compose -f docker-compose.prod.yml build backend frontend
          run_docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # Remove unused old images only. This does not remove containers, named volumes, or database data.
          run_docker image prune -af

          # Keep the latest 3 release folders for quick rollback; remove older source bundles.
          find "$DEPLOY_DIR/releases" -mindepth 1 -maxdepth 1 -type d ! -name "$APP_VERSION" \
            -printf '%T@ %p\n' | sort -nr | tail -n +3 | cut -d' ' -f2- | xargs -r rm -rf

          rm -f "$ARCHIVE"
          run_docker compose -f docker-compose.prod.yml ps
