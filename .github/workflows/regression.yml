name: Regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-and-integration-regression:
    name: Functional browser and integration regression
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: test
      PORT: 3000
      RUN_INTEGRATION: "true"
      INTEGRATION_TEST_DOCKER: "true"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci
      DATABASE_NAME: ci_regression_test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_regression_test
      JWT_SECRET: ci-regression-jwt-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-regression-refresh-secret-that-is-at-least-32-characters
      TTE_ENCRYPTION_SECRET: ci-regression-tte-secret-that-is-different-and-at-least-32-characters
      PUBLIC_APP_ORIGIN: http://localhost:5173
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SOP_PDF_STORAGE_DIR: /tmp/sopflow-regression-storage
      NOTIFICATION_IN_APP_ENABLED: "false"
      PDF_SIGNING_ENABLED: "true"
      E2E_CRITICAL: "false"
      E2E_BASE_URL: http://localhost:5173
      E2E_API_BASE_URL: http://127.0.0.1:3000/api/v1
      E2E_BROWSER_API_BASE_URL: http://localhost:3000/api/v1
      E2E_API_HEALTH_URL: http://127.0.0.1:3000/api/health/ready
      E2E_SKIP_LOGIN_PREFLIGHT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MariaDB matching production
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name sop-ci-regression-db \
            -e MARIADB_ROOT_PASSWORD=ci-root-password \
            -e MARIADB_DATABASE=ci_regression_test \
            -e MARIADB_USER=ci \
            -e MARIADB_PASSWORD=ci \
            -p 3306:3306 \
            mariadb:11.4 \
            --lower_case_table_names=1

          for i in {1..30}; do
            if docker exec sop-ci-regression-db healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker logs sop-ci-regression-db
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Apply migration chain
        working-directory: server
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy

      - name: Run server integration regression
        working-directory: server
        run: >-
          pnpm test:integration:run --no-cache --
          auth-session.integration-spec.ts
          rbac-access-control.integration-spec.ts
          opd-penyusun-lifecycle.integration-spec.ts
          core-workflow.integration-spec.ts
          evaluasi-edge-cases.integration-spec.ts
          sop-versioning.integration-spec.ts
          sop-autosave-concurrency.integration-spec.ts

      - name: Reset and seed browser regression database
        working-directory: server
        run: |
          pnpm prisma migrate reset --force
          pnpm db:seed:e2e

      - name: Start backend
        run: |
          pnpm --dir server start > /tmp/sopflow-regression-server.log 2>&1 &
          echo $! > /tmp/sopflow-regression-server.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sopflow-regression-server.log
          exit 1

      - name: Install Chromium
        working-directory: client
        run: pnpm exec playwright install --with-deps chromium

      - name: Run functional browser regression
        working-directory: client
        run: pnpm test:e2e:functional

      - name: Run smoke and UI regression
        working-directory: client
        run: pnpm test:e2e:smoke

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/sopflow-regression-server.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-playwright-report
          path: client/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop MariaDB
        if: always()
        run: docker rm -f sop-ci-regression-db || true
