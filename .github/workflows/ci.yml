name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-quality:
    name: Server quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      TTE_ENCRYPTION_SECRET: ci-tte-secret-that-is-different-and-at-least-32-characters
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci
      DATABASE_NAME: ci
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      PUBLIC_APP_ORIGIN: http://localhost:5173
      PDF_SIGNING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint changed TypeScript files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git -C .. fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
          else
            base_ref="${{ github.event.before }}"
            if [[ -z "$base_ref" || "$base_ref" =~ ^0+$ ]]; then
              base_ref="HEAD^"
            fi
          fi

          mapfile -t files < <(
            git -C .. diff --diff-filter=ACMR --name-only "$base_ref...HEAD" -- 'server/**/*.ts' \
              | sed 's#^server/##'
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed server TypeScript files to lint."
            exit 0
          fi

          printf 'Linting changed server files:\n - %s\n' "${files[@]}"
          pnpm exec eslint "${files[@]}"

      - name: Unit tests
        run: pnpm exec jest --runInBand

      - name: Build
        run: pnpm build

  client-quality:
    name: Client quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Audit E2E business journeys
        run: pnpm test:e2e:audit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database-invariants:
    name: Database migration invariants
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NODE_ENV: test
      RUN_INTEGRATION: "true"
      INTEGRATION_TEST_DOCKER: "true"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci
      DATABASE_NAME: ci_database_invariants_test
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_database_invariants_test
      JWT_SECRET: ci-invariant-jwt-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-invariant-refresh-secret-that-is-at-least-32-characters
      TTE_ENCRYPTION_SECRET: ci-invariant-tte-secret-that-is-at-least-32-characters
      PUBLIC_APP_ORIGIN: http://localhost:5173
      NOTIFICATION_IN_APP_ENABLED: "false"
      PDF_SIGNING_ENABLED: "false"
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MariaDB matching production
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name sop-ci-database-invariants \
            -e MARIADB_ROOT_PASSWORD=ci-root-password \
            -e MARIADB_DATABASE=ci_database_invariants_test \
            -e MARIADB_USER=ci \
            -e MARIADB_PASSWORD=ci \
            -p 3306:3306 \
            mariadb:11.4 \
            --lower_case_table_names=1

          for i in {1..30}; do
            if docker exec sop-ci-database-invariants healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker logs sop-ci-database-invariants
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate schema and apply production migration chain
        shell: bash
        run: |
          set -euo pipefail
          pnpm prisma validate
          pnpm prisma generate

          set +e
          migration_output="$(pnpm prisma migrate deploy 2>&1)"
          migration_status=$?
          set -e
          printf '%s\n' "$migration_output"

          if [[ "$migration_status" -ne 0 ]]; then
            annotation="$(printf '%s\n' "$migration_output" | tail -n 20 | tr '\n' ' ')"
            echo "::error title=Prisma migrate deploy failed::$annotation"
            exit "$migration_status"
          fi

          pnpm prisma migrate status

      - name: Run database invariant integration tests
        shell: bash
        run: |
          set +e
          test_output="$(pnpm test:integration:run --no-cache -- database-invariants.integration-spec.ts 2>&1)"
          test_status=$?
          set -e
          printf '%s\n' "$test_output"

          if [[ "$test_status" -ne 0 ]]; then
            annotation="$(printf '%s\n' "$test_output" | tail -n 40 | tr '\n' ' ')"
            echo "::error title=Database invariant tests failed::$annotation"
            exit "$test_status"
          fi

      - name: Stop MariaDB
        if: always()
        working-directory: .
        run: docker rm -f sop-ci-database-invariants || true

  critical-e2e:
    name: Critical E2E business journeys
    runs-on: ubuntu-latest
    needs:
      - server-quality
      - client-quality
      - database-invariants
    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci
      DATABASE_NAME: ci_e2e
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci_e2e
      JWT_SECRET: ci-e2e-jwt-secret-that-is-at-least-32-characters
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret-that-is-at-least-32-characters
      TTE_ENCRYPTION_SECRET: ci-e2e-tte-secret-that-is-different-and-at-least-32-characters
      PUBLIC_APP_ORIGIN: http://localhost:5173
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SOP_PDF_STORAGE_DIR: /tmp/sopflow-e2e-storage
      NOTIFICATION_IN_APP_ENABLED: "false"
      PDF_SIGNING_ENABLED: "true"
      E2E_CRITICAL: "true"
      E2E_BASE_URL: http://localhost:5173
      E2E_API_BASE_URL: http://127.0.0.1:3000/api/v1
      E2E_BROWSER_API_BASE_URL: http://localhost:3000/api/v1
      E2E_API_HEALTH_URL: http://127.0.0.1:3000/api/health/ready
      E2E_SKIP_LOGIN_PREFLIGHT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start MariaDB matching production
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name sop-ci-critical-e2e-db \
            -e MARIADB_ROOT_PASSWORD=ci-root-password \
            -e MARIADB_DATABASE=ci_e2e \
            -e MARIADB_USER=ci \
            -e MARIADB_PASSWORD=ci \
            -p 3306:3306 \
            mariadb:11.4 \
            --lower_case_table_names=1

          for i in {1..30}; do
            if docker exec sop-ci-critical-e2e-db healthcheck.sh --connect --innodb_initialized >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker logs sop-ci-critical-e2e-db
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Create disposable database schema
        working-directory: server
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
          pnpm db:seed:e2e

      - name: Start backend
        run: |
          pnpm --dir server start > /tmp/sopflow-server.log 2>&1 &
          echo $! > /tmp/sopflow-server.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sopflow-server.log
          exit 1

      - name: Install Chromium
        working-directory: client
        run: pnpm exec playwright install --with-deps chromium

      - name: Run J01-J07
        working-directory: client
        run: pnpm test:e2e:critical

      - name: Dump backend log on failure
        if: failure()
        run: cat /tmp/sopflow-server.log || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critical-e2e-playwright-report
          path: client/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop MariaDB
        if: always()
        run: docker rm -f sop-ci-critical-e2e-db || true

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs:
      - server-quality
      - client-quality
      - critical-e2e
    env:
      DB_ROOT_PASSWORD: ci-root-password
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      TTE_ENCRYPTION_SECRET: ci-tte-secret-that-is-different-and-at-least-32-characters
      PUBLIC_APP_ORIGIN: https://sop.example.test
      ALLOWED_ORIGINS: https://sop.example.test
      PDF_SIGNING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f compose.yml config --quiet

      - name: Build backend image
        run: docker build --file server/Dockerfile server

      - name: Build frontend image
        run: docker build --file client/Dockerfile client
