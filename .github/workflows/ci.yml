name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-quality:
    name: Server quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      TTE_ENCRYPTION_SECRET: ci-tte-secret-that-is-different-and-at-least-32-characters
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_USER: ci
      DATABASE_PASSWORD: ci
      DATABASE_NAME: ci
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci
      PUBLIC_APP_ORIGIN: http://localhost:5173
      WHATSAPP_ENABLED: "false"
      PDF_SIGNING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm exec jest --runInBand

      - name: Build
        run: pnpm build

  client-quality:
    name: Client quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs:
      - server-quality
      - client-quality
    env:
      DB_ROOT_PASSWORD: ci-root-password
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-jwt-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      TTE_ENCRYPTION_SECRET: ci-tte-secret-that-is-different-and-at-least-32-characters
      PUBLIC_APP_ORIGIN: https://sop.example.test
      ALLOWED_ORIGINS: https://sop.example.test
      WHATSAPP_ENABLED: "false"
      PDF_SIGNING_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose -f compose.yml config --quiet

      - name: Build backend image
        run: docker build --file server/Dockerfile server

      - name: Build frontend image
        run: docker build --file client/Dockerfile client
