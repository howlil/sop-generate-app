name: CI/CD Production

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: Client CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  server:
    name: Server CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate
        env:
          DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

      - name: Test core unit
        run: pnpm test:core-unit

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy to private VPS
    needs:
      - client
      - server
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux]
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ENV_PRODUCTION VPS_HOST VPS_USER VPS_PASSWORD VPS_SUDO_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret $name belum diisi"
              missing=1
            fi
          done
          exit "$missing"
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}

      - name: Prepare release bundle
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_ARCHIVE="$RUNNER_TEMP/sopflow-${GITHUB_SHA}.tar.gz"
          ENV_FILE="$RUNNER_TEMP/sopflow-${GITHUB_SHA}.env"
          SUDO_FILE="$RUNNER_TEMP/sopflow-${GITHUB_SHA}.sudo"

          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='client/node_modules' \
            --exclude='server/node_modules' \
            --exclude='.pnpm-store' \
            --exclude='client/dist' \
            --exclude='server/dist' \
            --exclude='client/test-results' \
            --exclude='client/playwright-report' \
            --exclude='server/coverage' \
            -czf "$RELEASE_ARCHIVE" .

          printf '%s\n' "$ENV_PRODUCTION" > "$ENV_FILE"
          printf '%s' "$VPS_SUDO_PASSWORD" > "$SUDO_FILE"
          chmod 600 "$ENV_FILE" "$SUDO_FILE"
        env:
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          VPS_SUDO_PASSWORD: ${{ secrets.VPS_SUDO_PASSWORD }}

      - name: Install deploy tools
        shell: bash
        run: |
          set -euo pipefail
          if command -v sshpass >/dev/null 2>&1 && command -v nc >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::Install sshpass and netcat-openbsd on the self-hosted runner"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y sshpass netcat-openbsd

      - name: Wait for VPS SSH
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if nc -z -w 5 "$VPS_HOST" 22; then
              echo "VPS SSH port is reachable"
              exit 0
            fi
            echo "Waiting for VPS SSH ($attempt/30)..."
            sleep 5
          done
          echo "::error::Cannot reach VPS SSH on port 22 from this self-hosted runner"
          exit 1
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Trust VPS host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          if ! ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts; then
            echo "::warning::Unable to prefetch VPS host key; deploy SSH connections will verify with StrictHostKeyChecking=accept-new"
          fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Upload release
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=30
          )
          sshpass -p "$VPS_PASSWORD" scp "${SSH_OPTS[@]}" \
            "$RUNNER_TEMP/sopflow-${GITHUB_SHA}.tar.gz" \
            "$RUNNER_TEMP/sopflow-${GITHUB_SHA}.env" \
            "$RUNNER_TEMP/sopflow-${GITHUB_SHA}.sudo" \
            "$VPS_USER@$VPS_HOST:/tmp/"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}

      - name: Deploy release
        shell: bash
        run: |
          set -euo pipefail
          SSH_OPTS=(
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=30
          )
          sshpass -p "$VPS_PASSWORD" ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
            "DEPLOY_SHA='$GITHUB_SHA' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="${APP_DIR:-$HOME/sopflow}"
          RELEASE_DIR="$APP_DIR/releases/$DEPLOY_SHA"
          SHARED_DIR="$APP_DIR/shared"
          ARCHIVE="/tmp/sopflow-$DEPLOY_SHA.tar.gz"
          ENV_FILE="/tmp/sopflow-$DEPLOY_SHA.env"
          SUDO_FILE="/tmp/sopflow-$DEPLOY_SHA.sudo"

          cleanup() {
            rm -f "$ARCHIVE" "$ENV_FILE" "$SUDO_FILE"
          }
          trap cleanup EXIT

          mkdir -p "$RELEASE_DIR" "$SHARED_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          mv "$ENV_FILE" "$SHARED_DIR/.env"
          chmod 600 "$SHARED_DIR/.env"
          ln -sfn "$SHARED_DIR/.env" "$RELEASE_DIR/.env"
          ln -sfn "$RELEASE_DIR" "$APP_DIR/current"

          SUDO_PASSWORD="$(cat "$SUDO_FILE")"

          docker_compose() {
            if docker compose version >/dev/null 2>&1; then
              docker compose "$@"
            else
              printf '%s\n' "$SUDO_PASSWORD" | sudo -S docker compose "$@"
            fi
          }

          cd "$APP_DIR/current"
          APP_VERSION="$DEPLOY_SHA" docker_compose --env-file .env config -q
          APP_VERSION="$DEPLOY_SHA" docker_compose --env-file .env build --pull
          APP_VERSION="$DEPLOY_SHA" docker_compose --env-file .env up -d --remove-orphans
          APP_VERSION="$DEPLOY_SHA" docker_compose --env-file .env ps

          find "$APP_DIR/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -rn \
            | awk 'NR > 5 {print $2}' \
            | xargs -r rm -rf
          REMOTE
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
