# Variabel lingkungan: file .env di root repo.
# Jangan pakai container_name — Dokploy memakai project prefix (-p) agar nama unik per deploy.
services:
  db:
    image: mariadb:11.4
    restart: always
    command:
      - --lower_case_table_names=1
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - db-prod-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sop-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
    command: ["sh", "-c", "pnpm prisma migrate deploy && pnpm start:prod"]
    # Tidak publish ke host — port 3000 dipakai Dokploy. API diakses via frontend (/api/ → backend:3000).
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sop-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sop-network

networks:
  sop-network:
    driver: bridge

volumes:
  db-prod-data:
