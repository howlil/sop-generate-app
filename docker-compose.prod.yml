name: sop-arsip

# Variabel lingkungan: file .env di root repo / release aktif.
# Compose ini dipakai sebagai base deployment Easypanel. Jangan bind port host di sini;
# domain dan HTTPS dikelola oleh reverse proxy Easypanel.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --lower_case_table_names=1
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Jakarta
    volumes:
      - db-prod-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sop-network

  backend:
    image: sop-arsip-backend:${APP_VERSION:-local}
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-user-sync:
        condition: service_completed_successfully
      waha:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      DATABASE_NAME: ${DB_NAME}
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      SOP_PDF_STORAGE_DIR: ${SOP_PDF_STORAGE_DIR:-/app/storage/sop-pdf}
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
    command: ["sh", "-c", "pnpm prisma migrate deploy && pnpm prisma db seed && pnpm start:prod"]
    volumes:
      - sop-pdf-prod-data:${SOP_PDF_STORAGE_DIR:-/app/storage/sop-pdf}
    # Tidak publish ke host. API diakses via frontend (/api/ -> backend:3000).
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sop-network

  db-user-sync:
    image: mariadb:11.4
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    command:
      - sh
      - -c
      - |
        set -eu
        case "$${DB_NAME}" in (*[!A-Za-z0-9_]*|"") echo "DB_NAME hanya boleh huruf, angka, dan underscore"; exit 1;; esac
        case "$${DB_USER}" in (*[!A-Za-z0-9_]*|"") echo "DB_USER hanya boleh huruf, angka, dan underscore"; exit 1;; esac
        db_password_sql=$$(printf "%s" "$${DB_PASSWORD}" | sed "s/'/''/g")
        MYSQL_PWD="$${DB_ROOT_PASSWORD}" mariadb -h db -uroot --protocol=tcp -e "CREATE DATABASE IF NOT EXISTS \`$${DB_NAME}\`; CREATE USER IF NOT EXISTS '$${DB_USER}'@'%' IDENTIFIED BY '$${db_password_sql}'; ALTER USER '$${DB_USER}'@'%' IDENTIFIED BY '$${db_password_sql}'; GRANT ALL PRIVILEGES ON \`$${DB_NAME}\`.* TO '$${DB_USER}'@'%'; FLUSH PRIVILEGES;"
    networks:
      - sop-network

  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.4.3}
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_API_HOSTNAME: 0.0.0.0
      WHATSAPP_API_PORT: 3000
      WAHA_PUBLIC_URL: ${WAHA_PUBLIC_URL:-}
      TZ: Asia/Jakarta
    volumes:
      - waha-session-prod-data:/app/.sessions
    # Easypanel boleh diarahkan ke service ini port internal 3000 untuk dashboard/QR.
    # Backend tetap memakai URL internal http://waha:3000.
    expose:
      - "3000"
    networks:
      - sop-network

  frontend:
    image: sop-arsip-frontend:${APP_VERSION:-local}
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Easypanel mengarahkan domain ke port internal ini. Tidak bind 80:80 agar
    # tidak bentrok dengan reverse proxy Easypanel di host.
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - sop-network

networks:
  sop-network:
    driver: bridge

volumes:
  db-prod-data:
    name: sop-arsip-db-prod-data
  sop-pdf-prod-data:
    name: sop-arsip-pdf-prod-data
  waha-session-prod-data:
    name: sop-arsip-waha-session-prod-data
